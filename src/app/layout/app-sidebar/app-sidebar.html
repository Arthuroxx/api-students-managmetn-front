<aside id="app-sidebar" class="sidebar" [class.is-open]="open()">
  <div class="sidebar__header">
    <a class="sidebar__brand" routerLink="/" (click)="navigated.emit()">
      <sms-brand-mark />
    </a>

    <button
      type="button"
      class="sidebar__close"
      aria-label="Close navigation"
      (click)="closed.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Main">
    <p class="sidebar__section">Workspace</p>

    <ul>
      @for (item of items; track item.path) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
            (click)="navigated.emit()"
          >
            <span class="sidebar__icon" aria-hidden="true">
              @switch (item.icon) {
                @case ('overview') {
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="4" width="6" height="6" rx="1" />
                    <rect x="14" y="4" width="6" height="6" rx="1" />
                    <rect x="4" y="14" width="6" height="6" rx="1" />
                    <rect x="14" y="14" width="6" height="6" rx="1" />
                  </svg>
                }
                @case ('students') {
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="9" cy="8" r="3.5" />
                    <path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3A4.5 4.5 0 0 1 15 18.5V20" />
                    <path d="M16.5 5.2a3.5 3.5 0 0 1 0 5.6M18 14.2a4.5 4.5 0 0 1 3 4.3V20" />
                  </svg>
                }
              }
            </span>

            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <p class="sidebar__stage">Stage 5 · Student management</p>
    <p class="sidebar__note">Records can be created, edited, and deleted.</p>
  </div>
</aside>
