<header class="app-header">
  <div class="app-header__leading">
    <button
      #menuButton
      type="button"
      class="app-header__menu"
      aria-label="Open navigation"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="menuExpanded()"
      (click)="menuToggled.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <span class="app-header__title">{{ title() }}</span>
  </div>

  <div class="app-header__actions">
    <button
      type="button"
      class="app-header__icon-button app-header__theme"
      [attr.aria-label]="themeActionLabel()"
      [attr.title]="themeActionLabel()"
      (click)="theme.cycle()"
    >
      @switch (theme.mode()) {
        @case ('light') {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        }
        @case ('dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        }
      }
    </button>

    @if (auth.user(); as user) {
      <div class="app-header__account">
        <span class="app-header__account-text">
          <span class="app-header__account-email">{{ user.email }}</span>
          <span class="app-header__account-role">{{ user.role }}</span>
        </span>

        <button
          type="button"
          class="app-header__icon-button app-header__signout"
          aria-label="Sign out"
          title="Sign out"
          (click)="signOut()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
            <path d="M10 8l-4 4 4 4M6 12h9" />
          </svg>
        </button>
      </div>
    }
  </div>
</header>
