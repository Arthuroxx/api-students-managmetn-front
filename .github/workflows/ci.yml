name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# The pipeline only verifies the project. It never pushes or deploys.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and accessibility tests
        run: npm test

      - name: Run build-tooling tests
        run: npm run test:scripts

      - name: Build for production
        run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t students-management-frontend:ci .
